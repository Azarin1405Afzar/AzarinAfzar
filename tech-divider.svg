<svg width="100%" viewBox="0 0 1400 110" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="55%" stop-color="#1C2541"/>
      <stop offset="100%" stop-color="#3A2E12"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1400" height="110" fill="url(#bgGrad)"/>

  <!-- circuit trace pattern -->
  <g stroke="#D4AF37" stroke-opacity="0.18" stroke-width="1.5" fill="none">
    <path d="M0,20 H120 V50 H220"/>
    <path d="M180,90 H300 V60 H420 V30"/>
    <path d="M500,15 H600 V45 H720 V85"/>
    <path d="M760,25 H880 V55 H980"/>
    <path d="M1040,80 H1140 V40 H1260 V15"/>
    <path d="M1300,60 H1400"/>
    <circle cx="120" cy="20" r="3" fill="#D4AF37" fill-opacity="0.4"/>
    <circle cx="220" cy="50" r="3" fill="#D4AF37" fill-opacity="0.4"/>
    <circle cx="420" cy="30" r="3" fill="#D4AF37" fill-opacity="0.4"/>
    <circle cx="880" cy="55" r="3" fill="#D4AF37" fill-opacity="0.4"/>
    <circle cx="1260" cy="15" r="3" fill="#D4AF37" fill-opacity="0.4"/>
  </g>

  <!-- neural network icon left -->
  <g transform="translate(70,55)">
    <circle cx="0" cy="-25" r="5" fill="#F4C430"/>
    <circle cx="0" cy="0" r="5" fill="#F4C430"/>
    <circle cx="0" cy="25" r="5" fill="#F4C430"/>
    <circle cx="35" cy="-12" r="5" fill="#EAF2FF"/>
    <circle cx="35" cy="12" r="5" fill="#EAF2FF"/>
    <circle cx="70" cy="0" r="6" fill="#D4AF37"/>
    <g stroke="#D4AF37" stroke-width="1.2" stroke-opacity="0.7">
      <line x1="0" y1="-25" x2="35" y2="-12"/>
      <line x1="0" y1="0" x2="35" y2="-12"/>
      <line x1="0" y1="0" x2="35" y2="12"/>
      <line x1="0" y1="25" x2="35" y2="12"/>
      <line x1="35" y1="-12" x2="70" y2="0"/>
      <line x1="35" y1="12" x2="70" y2="0"/>
    </g>
  </g>

  <!-- chip icon center -->
  <g transform="translate(700,55)">
    <rect x="-22" y="-22" width="44" height="44" rx="4" fill="none" stroke="#F4C430" stroke-width="2"/>
    <rect x="-10" y="-10" width="20" height="20" fill="#F4C430" fill-opacity="0.25"/>
    <g stroke="#F4C430" stroke-width="2">
      <line x1="-30" y1="-14" x2="-22" y2="-14"/>
      <line x1="-30" y1="0" x2="-22" y2="0"/>
      <line x1="-30" y1="14" x2="-22" y2="14"/>
      <line x1="30" y1="-14" x2="22" y2="-14"/>
      <line x1="30" y1="0" x2="22" y2="0"/>
      <line x1="30" y1="14" x2="22" y2="14"/>
      <line x1="-14" y1="-30" x2="-14" y2="-22"/>
      <line x1="14" y1="-30" x2="14" y2="-22"/>
      <line x1="-14" y1="30" x2="-14" y2="22"/>
      <line x1="14" y1="30" x2="14" y2="22"/>
    </g>
  </g>

  <!-- gear icon right -->
  <g transform="translate(1330,55)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#EAF2FF" stroke-width="3"/>
    <circle cx="0" cy="0" r="4" fill="#EAF2FF"/>
    <g stroke="#EAF2FF" stroke-width="3">
      <line x1="0" y1="-22" x2="0" y2="-14"/>
      <line x1="0" y1="22" x2="0" y2="14"/>
      <line x1="-22" y1="0" x2="-14" y2="0"/>
      <line x1="22" y1="0" x2="14" y2="0"/>
      <line x1="-15.5" y1="-15.5" x2="-9.9" y2="-9.9"/>
      <line x1="15.5" y1="15.5" x2="9.9" y2="9.9"/>
      <line x1="-15.5" y1="15.5" x2="-9.9" y2="9.9"/>
      <line x1="15.5" y1="-15.5" x2="9.9" y2="-9.9"/>
    </g>
  </g>

  <!-- binary code accents -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#D4AF37" fill-opacity="0.35">
    <text x="260" y="95">01001010</text>
    <text x="480" y="20">10110100</text>
    <text x="900" y="95">00110101</text>
    <text x="1100" y="20">01110010</text>
  </g>

  <!-- center accent line -->
  <rect x="0" y="53" width="1400" height="4" fill="url(#lineGrad)"/>
</svg>
